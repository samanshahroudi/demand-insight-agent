[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "demand-insight-agent"
version = "0.1.0"
description = "A small LangGraph service for explainable product opportunity screening"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2,<3",
    "langgraph>=1,<2",
    "langchain-openai>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["demand_insight_agent*"]

[tool.setuptools.package-data]
demand_insight_agent = ["catalog.json"]

[tool.ruff]
line-length = 100
